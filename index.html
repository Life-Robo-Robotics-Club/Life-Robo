<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Life Robo — Robotics Club, FoET, University of Lucknow</title>
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Pre-paint: black canvas so there is no white flash before the intro mounts. */
      html,body{background:#000;color:#f5f5f7;margin:0}
      #boot{position:fixed;inset:0;background:#000;z-index:9999}
      html.intro-seen #boot{display:none}
    </style>
    <script>
      try { if (sessionStorage.getItem("lr-intro-seen") === "1") document.documentElement.classList.add("intro-seen"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="boot" aria-hidden="true"></div>
    <div id="root"></div>
    <noscript><p style="padding:24px;font-family:sans-serif">Life Robo — Robotics Club, FoET, University of Lucknow. Please enable JavaScript to view this site.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
